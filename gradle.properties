# As of OCT 2019, the R8/D8 stuff breaks plugins
#android.enableR8=false
android.useAndroidX=true

org.gradle.jvmargs=-Xms256m -Xmx4096m
org.gradle.daemon=false
org.gradle.parallel=false
android.useJetifier=true

# Required by ATAK takdevLint for release builds
android.bundle.storeArchive.enable=false

# Note: android.bundle.enableUncompressedNativeLibs was removed in AGP 8.1+
# The TPP Build Environment doc mentions it but AGP 8.13.0 rejects it.
# Native lib packaging is handled via packagingOptions.jniLibs.useLegacyPackaging instead.

# Enable Gradle caching
#org.gradle.caching=true
#org.gradle.caching.debug=true

# Enable Gradle logging
#org.gradle.logging.level=debug
#org.gradle.logging.stacktrace=full
#logging.level=LogLevel.DEBUG